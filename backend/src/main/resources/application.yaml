spring:
  application:
    name: realtime-translator

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/realtime_translator}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    # Prevent accidental schema drift — only Flyway manages DDL.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Batch size for saveAll() — reduces DB round trips during
          # ScriptBuffer flush (100 entries = 2 batches instead of 100 INSERTs).
          batch_size: 50
        # Group INSERTs by entity type for more efficient batching.
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  openai:
    api-key: ${OPENAI_API_KEY:}
    whisper:
      model: whisper-1
      timeout-seconds: 10
      max-retries: 2
